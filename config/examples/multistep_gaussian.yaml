inference_workflows:
  two_step:
    type: multistep
    steps:
    - first
    - second
    prior_sources:
      second:
        posterior_file: posterior.h5
        method: gaussian
    run_mcmc: true
    verify_prior_vs_posterior: true
    run_closure_tests: false

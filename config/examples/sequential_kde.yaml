# Native Bayesian configuration. Prepare its analytic inputs with examples.inference.prepare.
output_dir: output/examples/sequential_kde
observable_table_dir: .
observable_config_dir: .
observables_filename: observables.h5
initialize_observables: false
preprocess_input_data: false
fit_emulators: false
run_mcmc: true
run_closure_tests: false
skip_inference_workflows: false
plot:
  input_data: false
  emulators: false
  mcmc: false
  qhat: false
  closure_tests: false
  across_analyses: false
  discrepancy: false
example:
  kind: sequential
  data_seed: 418
analyses:
  demo:
    parameterizations:
    - exponential
    parameterization:
      exponential:
        names:
        - AlphaS
        - nucleon_width
        - normalization
        min:
        - 0.1
        - 0.5
        - 10.0
        max:
        - 0.5
        - 1.5
        - 20.0
    parameters:
      mcmc:
        mcmc_package: emcee
        random_seed: 314159
        n_walkers: 12
        n_burn_steps: 80
        n_sampling_steps: 200
        n_logging_steps: 1000
        compute_evidence: false
        export_hard_likelihood_samples: false
        pocoMC:
          n_effective: 128
          n_active: 64
          draw_n_prior_samples: 256
          n_total_samples: 1000
          n_importance_samples_for_evidence: 0
        sequential_inference:
          enabled: true
          soft_density_model_file: ../../data/sequential_priors/projected_soft_kde_2d/kde_soft_posterior_2d.pkl
          soft_parameter_names:
          - nucleon_width
          - normalization
          alpha_parameter_name: AlphaS
          hard_likelihood_power: 1.0
      emulators:
        linear:
          emulator_name: sk_learn
          n_pc: null
          observable_list:
          - hadron__pt_

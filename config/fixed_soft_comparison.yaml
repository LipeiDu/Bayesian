# Configuration for fixed-soft comparison using the same reduced soft-hard tables.
# The emulator still uses the full 3D design over:
#   (AlphaS, nucleon_width, normalization)
# but the inference fixes the two soft parameters and only samples AlphaS.

output_dir: "output/fixed_soft_comparison_preprocessed_noPCA"

initialize_observables: False
preprocess_input_data: False
fit_emulators: False
run_mcmc: False
run_closure_tests: False

plot:
  input_data: False
  emulators: False
  mcmc: False
  qhat: True
  closure_tests: False
  across_analyses: False

debug_level: 0

observable_table_dir: "../STAT-outputs/20260401/tables"
observable_config_dir: "../jetscape-analysis/config"
observables_filename: "observables.h5"

skip_standard_analyses: False
skip_inference_workflows: True
inference_workflows: {}

parameters:
  preprocessing_parameters: &default_preprocessing_parameters
    smoothing:
      outlier_n_RMS: 2.0
      interpolation_method: "linear"
      max_n_feature_outliers_to_interpolate: 2

  emulator_parameters: &default_emulator_parameters
    force_retrain: False
    kernels:
      active: ["matern", "noise"]
      matern:
        nu: 1.5
        length_scale_bounds_factor: [0.01, 100]
      rbf:
        length_scale_bounds_factor: [0.01, 100]
      constant:
        constant_value: 1.0
        constant_value_bounds: [0.001, 10]
      noise:
        type: "white"
        args:
          noise_level: 0.25
          noise_level_bounds: [0.0001, 1]
    GPR:
      n_restarts: 50
      alpha: 1.0e-10
    cross_validation: False
    cross_validation_k: 5
    independent_validation: True

  mcmc_parameters: &default_mcmc_parameters
    n_walkers: 100
    n_burn_steps: 1000
    n_sampling_steps: 5000
    n_logging_steps: 10

  closure: &default_closure_parameters
    confidence: 0.9

analysis_base: &fixed_soft_model_base
  model_name: "MATTER+LBT"
  parameterizations: ["exponential"]
  sqrts_list: [200, 2760, 5020]
  centrality_range: [0, 10]
  recoil_scheme: "negative_recominber"
  parameterization:
    exponential:
      names: ["AlphaS", "nucleon_width", "normalization"]
      min: [0.1, 0.5, 10.0]
      max: [0.5, 1.5, 20.0]
      qhat_alpha_s_parameter: "AlphaS"
      # Fixed soft-sector comparison point. Adjust these values as desired.
      fixed_parameters:
        nucleon_width: 1.12
        normalization: 14.2
      fixed_model_parameters:
        Q0: 1.652620
        C1: -4.510520
        C2: -1.311680
        Tau0: 0.325466
        C3: 3.673320
  alpha: 0.2
  design_points_to_exclude: [0, 2, 3]
  validation_indices: [0, 0]

analyses:
  fixed_soft_comparison:
    parameters:
      preprocessing:
        <<: *default_preprocessing_parameters
      emulators:
        hadron_group:
          <<: *default_emulator_parameters
          emulator_name: sk_learn
          n_pc: null
          observable_list:
            - 'hadron__pt_'
        jet_group:
          <<: *default_emulator_parameters
          emulator_name: sk_learn
          n_pc: null
          observable_list:
            - "jet__pt_"
          observable_exclude_list:
            - "pt_y_atlas"
            - "2760__PbPb__inclusive_chjet__pt_alice"
      mcmc:
        <<: *default_mcmc_parameters
      closure:
        <<: *default_closure_parameters
    <<: *fixed_soft_model_base
    cuts:
      "chjet__pt_star__R0.2": [14, 100]
      "chjet__pt_star__R0.4": [16, 100]
    plot_panel_shapes: [[3, 3], [3, 3], [3, 3], [3, 3], [3, 3]]
